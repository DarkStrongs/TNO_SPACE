 # ======================================================================
 # 帮助层（interface/NSP_help.gui 由 work/r69/gen.py 生成结构，文案在这里改）
 # ======================================================================
 NSP_HELP_TITLE: "[GetNSPHelpTitle]"
 NSP_HELP_TEXT: "[GetNSPHelpText]"
 NSP_HELP_PG: "§Y[?NSP_help_pg|0]§! / [?NSP_help_n|0]"
 NSP_HELP_PREV_TT: "上一页"
 NSP_HELP_NEXT_TT: "下一页"
 NSP_HELP_TOC_TT: "回到目录"
 NSP_HELP_CLOSE_TT: "关闭帮助（§YESC§!）"
 NSP_HELP_T_0: "§W太空计划指南§!"
 NSP_HELP_D_0: "美国航空航天局（NASA）的指挥中心。点击下方条目查看各区域说明，或用左右箭头逐页浏览。"
 NSP_HELP_T_1: "进行中的计划"
 NSP_HELP_D_1: "顶部页签切换计划，带§G绿色对勾§!的计划已完成两个目标。\n\n每个计划有§Y目标 A§!和§Y目标 B§!，进度条每格代表一次需要完成的任务；成功执行符合描述的任务即可推进。\n\n底部是§YNASA 统一预算§!，所有计划和研发共用，国会每半年（26 周）拨款一次。"
 NSP_HELP_T_2: "星图与卫星"
 NSP_HELP_D_2: "在§Y地球§!、§Y月球§!、§Y太阳系§!三种视图间切换，悬停天体可查看说明。\n\n成功进入轨道的任务会在对应天体留下§Y卫星§!；点击右侧卫星图标可显示它的轨道线。\n\n下方§Y轨道目标§!统计各目的地的任务数，点击一行筛选，再点一次取消。"
 NSP_HELP_T_3: "任务控制"
 NSP_HELP_D_3: "§Y本国§!页签列出正在执行的任务，显示当前阶段和预计完成时间。\n\n任务走完全部阶段后，按§Y总可靠性§!判定成败：§G成功§!提升公众支持度和太空科技，§R失败§!会降低公众支持度。\n\n结束的任务移到§Y历史§!页签，最新的排在最前。"
 NSP_HELP_T_4: "任务规划与研发"
 NSP_HELP_D_4: "§Y创建任务§!打开规划器：依次选择载荷、目的地、发射场、运载火箭和修正，确认 Delta-V 余量、可靠性和成本后发射。不满足的条件会在启动按钮的提示里列出。\n\n§Y研究与发展§!是按年代推进的科技树，用来解锁新的载荷、火箭、修正和发射场。"
 NSP_HELP_T_5: "太空科技等级"
 NSP_HELP_D_5: "研发完成和任务成功都会积累§Y太空科技§!。\n\n进度条填满后升到下一级，并获得§G额外拨款§!和§G公众支持度§!。"
 NSP_HELP_T_6: "局长与公众支持度"
 NSP_HELP_D_6: "§YNASA公众支持度§!代表公众对太空计划的支持：任务成功会上升，失败会下降，平时缓慢回落到 50%。\n\n国会按支持度决定每半年拨款的多少。想要更多预算，就要持续拿出成功的任务。"
 NSP_HELP_IDX_0: "0"
 NSP_HELP_IDX_1: "1"
 NSP_HELP_IDX_2: "2"
 NSP_HELP_IDX_3: "3"
 NSP_HELP_IDX_4: "4"
 NSP_HELP_IDX_5: "5"
 NSP_HELP_IDX_6: "6"
