 NSP_TECH_TT: "§Y太空科技§!\n§g--------------§!\n等级：§Y第 [?NSP_tech_tier|0] 级「[GetNSPTierName]」§!\n进度：§Y[?NSP_tech|0]§! / [?NSP_tech_max|0]（还差 §Y[?NSP_tier_need|0]§! 升到第 [?NSP_tech_tier_next|0] 级）\n\n§Y当前效果：§!\n  研发速度：§G+[?NSP_tier_rdspd|0]%§!\n  火箭可靠性加成：§G+[?NSP_tier_rel|0]§![GetNSPTierSlotsGot]"
 NSP_TECH_TT_D: "§Y怎么获得太空科技§!\n  研发完成：按项目难度 +2～12\n  任务成功：近地轨道 5、极地 6、交会 / 地球静止 8、逃逸 10、地月转移 12；载人任务再 +3\n\n§Y升级规则§!\n  升到下一级需要 30 + 10 × 当前等级 点，溢出的点数会保留，可以连升。\n  每升一级：拨款 +(300 + 50 × 新等级) 百万美元、公众支持度 +3。\n  第 4、7、10 级各额外 +1 研发槽。\n\n§g研发速度加成只影响之后开工的项目；火箭可靠性加成和其他加成一样按 50% 计入。§!"
