 # ==================== 事件 ====================

 # ---- 任务结果事件 nsp.1..7 ----
 nsp.1.t: "任务成功"
 nsp.1.d: "本次顺利完成。全国的电视机前响起了掌声。"
 nsp.1.a: "向星辰进发。"
 nsp.2.t: "在轨任务失败"
 nsp.2.d: "飞行器已经入轨，但在轨运行中出现严重故障，任务被迫中止。调查委员会已经成立。"
 nsp.2.a: "我们会从中吸取教训。"
 nsp.3.t: "返程失败"
 nsp.3.d: "[GetNSPLastShort] [?NSP_m_num^NSP_last_mission|0] 在轨任务圆满完成，却在返程途中与地面失去了联系。回收舰队搜寻了整整一夜，最后在海面上只找到了烧焦的残骸。\n\n[GetNSPLastCrew]"
 nsp.3.a: "他们是为全人类而牺牲的。"
 nsp.4.t: "发射成功"
 nsp.4.d: "[GetNSPEvtShort] [?NSP_m_num^NSP_evt_mid|0] 顺利升空。各级分离正常，地面站确认飞行器已进入预定轨道，前往§Y[GetNSPEvtDest]§!。\n\n[GetNSPEvtNext]"
 nsp.4.a: "控制中心一片欢呼。"
 nsp.5.t: "发射失败"
 nsp.5.d: "[GetNSPLastShort] [?NSP_m_num^NSP_last_mission|0] [GetNSPLaunchFail]"
 nsp.5.a: "查明原因，下次再来。"
 nsp.6.t: "在轨任务失败"
 nsp.6.d: "[GetNSPEvtShort] [?NSP_m_num^NSP_evt_mid|0] 在轨期间发生严重故障，任务目标无法完成。飞行主任下令中止任务，乘组开始准备紧急返程。\n\n§g乘组能否平安回家，要到返程阶段结束才知道。§!"
 nsp.6.a: "把他们接回来。"
 nsp.7.t: "乘组平安返回"
 nsp.7.d: "[GetNSPLastShort] [?NSP_m_num^NSP_last_mission|0] 的任务虽然失败了，但返回舱安全溅落，回收舰把乘组接上了甲板。\n\n[GetNSPLastCrewSafe]"
 nsp.7.a: "人回来就好。"
 NSP_EVT_NEXT_UNCREW: "§g接下来是在轨运行阶段，任务结束时判定最终结果。§!"
 NSP_EVT_NEXT_CREW: "§g接下来是在轨运行阶段，之后乘组还要返程，返程时会再判定一次。§!"
 NSP_CREW_SAFE_0: "这次飞行没有乘员。"
 NSP_CREW_SAFE_1: "§Y[GetNSPLastCrewA]§! 平安归来。"
 NSP_CREW_SAFE_2: "§Y[GetNSPLastCrewA]§!、§Y[GetNSPLastCrewB]§! 平安归来。"
 NSP_CREW_SAFE_3: "§Y[GetNSPLastCrewA]§!、§Y[GetNSPLastCrewB]§!、§Y[GetNSPLastCrewC]§! 平安归来。"
 NSP_LFAIL_PAD: "点火后没能离开发射台：火箭在台上失去推力，随即爆炸。发射台需要检修，调查委员会已经成立。"
 NSP_LFAIL_AIR: "升空后不久偏离了弹道，靶场安全官按下了自毁按钮。残骸散落在大西洋上，调查委员会已经成立。"
 NSP_CREW_LAST_0: "这次飞行没有乘员。"
 NSP_CREW_LAST_1: "§Y[GetNSPLastCrewA]§! 没能回家。"
 NSP_CREW_LAST_2: "§Y[GetNSPLastCrewA]§!、§Y[GetNSPLastCrewB]§! 没能回家。"
 NSP_CREW_LAST_3: "§Y[GetNSPLastCrewA]§!、§Y[GetNSPLastCrewB]§!、§Y[GetNSPLastCrewC]§! 没能回家。"

 # ---- 乘组选拔事件 nsp.40 ----
 nsp.40.t: "乘组选拔：[GetNSPCrewMission] [?NSP_crew_num|0]"
 nsp.40.d: "[GetNSPCrewMission] [?NSP_crew_num|0] 进入乘组选拔与训练阶段，这次飞行共 §Y[?NSP_crew_seats|0]§! 个座位。\n\n现在选拔第 §Y[?NSP_crew_seat_disp|0]§! 席：§Y[GetNSPSeatRole]§!。\n待命的宇航员还有 §Y[?NSP_crew_pool_n|0]§! 人，以下是飞行乘组办公室推荐的候选人。\n\n§g宇航员每有一次飞行经验，任务和返程可靠性各 +0.5（最多 +2）。§!"
 nsp.40.o0: "[GetNSPCandName0]（飞行 [?NSP_crew_cand_fl^0|0] 次）"
 nsp.40.o1: "[GetNSPCandName1]（飞行 [?NSP_crew_cand_fl^1|0] 次）"
 nsp.40.o2: "[GetNSPCandName2]（飞行 [?NSP_crew_cand_fl^2|0] 次）"
 nsp.40.o3: "[GetNSPCandName3]（飞行 [?NSP_crew_cand_fl^3|0] 次）"
 nsp.40.more: "看看其他人选"
 nsp.40.none: "没有待命的宇航员，这个座位空着"

 # ---- 研发 / 科技等级 / 拨款事件 nsp.10..12 ----
 nsp.10.t: "研发完成"
 nsp.10.d: "§Y[GetNSPRDLastName]§! 已完成研发，相关成果已移交各中心。\n\n§g本周共完成 [?NSP_rd_done_n|0] 项研发。§!"
 nsp.10.a: "继续前进。"
 nsp.11.t: "太空科技等级提升"
 nsp.11.d: "随着一项项技术走出实验室、一次次发射划过天际，我们的太空能力迈上了新台阶。太空科技等级已提升至 §Y第 [?NSP_tech_tier|0] 级「[GetNSPTierName]」§!。"
 nsp.11.a: "下一个台阶。"
 nsp.12.t: "半年度太空拨款到账"
 nsp.12.d: "国会批准的半年度太空拨款已经到账。下一笔拨款将在 26 周后发放，金额取决于这半年里的 NASA 公众支持度。"
 nsp.12.a: "把钱花在刀刃上。"

 # ---- 计划开放事件 nsp.30..35 ----
 nsp.30.t: "应用卫星计划"
 nsp.30.d: "Syncom 2 的成功让国会看到了卫星的另一种价值：通信、气象、导航，每一项都能直接回报纳税人。NASA 将分散的卫星项目整合为§Y应用卫星计划§!。"
 nsp.30.a: "把太空带进千家万户。"
 nsp.31.t: "勘测者计划"
 nsp.31.d: "在把宇航员送上月球之前，我们必须知道月面能不能站人。喷气推进实验室提出的软着陆探测器系列获批，正式命名为§Y勘测者计划§!。"
 nsp.31.a: "先让机器替我们踩一脚。"
 nsp.32.t: "水手计划"
 nsp.32.d: "金星之后，下一个目标是火星。NASA 批准了新一轮行星际探测，§Y水手计划§!将把探测器送出地球引力范围。"
 nsp.32.a: "飞向红色星球。"
 nsp.33.t: "天空实验室计划"
 nsp.33.d: "阿波罗之后怎么办？「阿波罗应用计划」办公室提出，用土星火箭的剩余级改建一座轨道工作站，让宇航员在太空中长期生活和工作。它被称为§Y天空实验室计划§!。"
 nsp.33.a: "在轨道上安个家。"
 nsp.34.t: "双子星计划"
 nsp.34.d: "水星飞船只能装下一个人，也飞不了几圈。要去月球，我们得先学会长时间飞行、太空行走和在轨交会对接。NASA 宣布第二代载人飞船项目正式定名为§Y双子星计划§!。"
 nsp.34.a: "两个人，一艘船。"
 nsp.35.t: "阿波罗计划"
 nsp.35.d: "总统一年前在国会许下的承诺终于落到了纸面上：在这个十年结束之前，把人送上月球，再把他安全地带回来。预算、机构和发射场的规划全部到位，§Y阿波罗计划§!正式启动。"
 nsp.35.a: "我们选择登月。"

