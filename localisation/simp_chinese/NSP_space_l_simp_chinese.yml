 # ==================== 人物 ====================

 # ---- 局长 ----
 NSP_DIRECTOR_NAME: "詹姆斯·E·韦伯"
 NSP_DIRECTOR_TT: "§Y詹姆斯·埃德温·韦伯§!\n§g--------------§!\n§F现任国家航空航天局局长§!\n§g--------------§!\n§Y精明官僚§!\n - 半年拨款：§G+10%§!\n - 任务成本：§G-5%§!\n - 火箭可靠性：§R-2§!"
 NSP_DIRECTOR_TT_D: "詹姆斯·E·韦伯是个精明的官僚。他是北卡罗来纳州人，当过海军陆战队飞行员，后来做律师，再进华盛顿当公务员。杜鲁门时期他先任预算局局长，又任副国务卿，从此以擅长同国会周旋、能把庞大的联邦机构管得井井有条出名。\n\n德国的火箭从佩讷明德升空以后，美国的航天事业一直落后。1961年，韦伯接手国家航空航天局，接下的是一个预算捉襟见肘、各部门互相掣肘的烂摊子。他不是工程师，也从不假装是，但他清楚一件事：在德国人的阴影下，太空不只是科学问题，更是国家存亡的问题。\n\n韦伯在国会山上为每一分拨款据理力争，又在军方、承包商和科学家之间小心维持平衡。冷战每一次升温，他都看得到机会，也看得到风险。一次成功的发射能换来一年的预算，一次失败就可能断送整个计划。"

