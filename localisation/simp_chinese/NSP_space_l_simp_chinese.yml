 NSP_LSITE_FREE: "§G● 空闲§! §g—— 可以安排新的发射§!"
 NSP_LSITE_BUSY: "§Y● 占用中§! §g—— 有火箭正在这里准备或发射§!"
 NSP_LSITE_TT_0: "§W卡纳维拉尔角空军站§!\n[GetNSPLSiteState0]"
 NSP_LSITE_TT_0_D: "§g东海岸主力发射场，开局可用。§!\n§F极地轨道 Delta-V 需求：§!§R+0.3§!\n\n§g同一发射场同一时间只能准备一次发射：从规划到「发射」阶段结束，发射场都被这次任务占用；火箭升空进入在轨阶段后才能开始下一次。§!"
 NSP_LSITE_TT_1: "§W范登堡空军基地§!\n[GetNSPLSiteState1]"
 NSP_LSITE_TT_1_D: "§g西海岸，向南发射。§!\n§F极地轨道 Delta-V 需求：§!§G-0.3§!\n§F其他轨道 Delta-V 需求：§!§R+0.3§!\n\n§g同一发射场同一时间只能准备一次发射：从规划到「发射」阶段结束，发射场都被这次任务占用；火箭升空进入在轨阶段后才能开始下一次。§!"
 NSP_LSITE_TT_2: "§W沃洛普斯飞行设施§!\n[GetNSPLSiteState2]"
 NSP_LSITE_TT_2_D: "§g小型发射场。§!\n§F重型火箭：§!§R不可发射§!\n§F成本：§!§R+5%§!\n§F工期：§!§R+15%§!\n\n§g同一发射场同一时间只能准备一次发射：从规划到「发射」阶段结束，发射场都被这次任务占用；火箭升空进入在轨阶段后才能开始下一次。§!"
 NSP_LSITE_TT_3: "§W太平洋导弹靶场§!\n[GetNSPLSiteState3]"
 NSP_LSITE_TT_3_D: "§g夏威夷考艾岛，北纬 22°。§!\n§F地球静止轨道 Delta-V 需求：§!§G-0.1§!\n\n§g同一发射场同一时间只能准备一次发射：从规划到「发射」阶段结束，发射场都被这次任务占用；火箭升空进入在轨阶段后才能开始下一次。§!"
 NSP_LSITE_TT_4: "§W白沙导弹靶场§!\n[GetNSPLSiteState4]"
 NSP_LSITE_TT_4_D: "§g内陆小型靶场。§!\n§F重型火箭：§!§R不可发射§!\n§F成本：§!§R+5%§!\n§F工期：§!§R+15%§!\n\n§g同一发射场同一时间只能准备一次发射：从规划到「发射」阶段结束，发射场都被这次任务占用；火箭升空进入在轨阶段后才能开始下一次。§!"
 NSP_LSITE_TT_5: "§W肯尼迪航天中心§!\n[GetNSPLSiteState5]"
 NSP_LSITE_TT_5_D: "§g梅里特岛，39 号发射复合体。§!\n§G土星 V 唯一发射场§!\n§F极地轨道 Delta-V 需求：§!§R+0.3§!\n\n§g同一发射场同一时间只能准备一次发射：从规划到「发射」阶段结束，发射场都被这次任务占用；火箭升空进入在轨阶段后才能开始下一次。§!"
 NSP_LSITE_TT_6: "§W约翰斯顿环礁§!\n[GetNSPLSiteState6]"
 NSP_LSITE_TT_6_D: "§g中太平洋，北纬 16.7°。§!\n§F地球静止轨道 Delta-V 需求：§!§G-0.2§!\n§F极地轨道 Delta-V 需求：§!§R+0.3§!\n§F重型火箭：§!§R不可发射§!\n§F成本：§!§R+10%§!\n\n§g同一发射场同一时间只能准备一次发射：从规划到「发射」阶段结束，发射场都被这次任务占用；火箭升空进入在轨阶段后才能开始下一次。§!"
 NSP_LSITE_TT_7: "§W波克平原火箭靶场§!\n[GetNSPLSiteState7]"
 NSP_LSITE_TT_7_D: "§g阿拉斯加，北纬 65°，小型靶场。§!\n§F极地轨道 Delta-V 需求：§!§G-0.4§!\n§F其他轨道 Delta-V 需求：§!§R+0.4§!\n§F重型火箭：§!§R不可发射§!\n§F成本：§!§R+5%§!\n§F工期：§!§R+15%§!\n\n§g同一发射场同一时间只能准备一次发射：从规划到「发射」阶段结束，发射场都被这次任务占用；火箭升空进入在轨阶段后才能开始下一次。§!"

