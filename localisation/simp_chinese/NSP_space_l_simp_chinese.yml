 NSP_IE_TT_N: "§Y[GetNSPMissionPayload] [?NSP_m_num^v|0]§!\n§g[GetNSPHistDest] · [GetNSPHistSite]§!\n--------------\n§F载荷：§!§Y[GetNSPHistPL]§!\n§F火箭：§!§Y[GetNSPHistVE]§![GetNSPHistCrew][GetNSPHistEnd]\n\n结果：[GetNSPHistResult]"
 NSP_ARCH_NAME_0: "Vanguard TV-3"
 NSP_ARCH_ETA_0: "§g1957.12.06§! · 近地轨道"
 NSP_ARCH_TT_0: "§YVanguard TV-3§!\n§g1957.12.06 · 卡纳维拉尔角 · 先锋号§!\n--------------\n美国第一次卫星发射尝试，全国电视直播。火箭离台约 1.2 米后失去推力，倒回发射台爆炸。报纸给它起了外号：「Flopnik」、「Kaputnik」。\n\n结果：§R失败§!"
 NSP_ARCH_NAME_1: "Explorer 1"
 NSP_ARCH_ETA_1: "§g1958.01.31§! · 近地轨道"
 NSP_ARCH_TT_1: "§YExplorer 1§!\n§g1958.01.31 · 卡纳维拉尔角 · 朱诺 I§!\n--------------\n陆军弹道导弹局用朱诺 I 火箭把冯·布劳恩团队的探险者 1 号送入轨道，美国的第一颗人造卫星。范艾伦用它的盖革计数器发现了地球辐射带。\n\n结果：§G成功§!"
 NSP_ARCH_NAME_2: "Vanguard 1"
 NSP_ARCH_ETA_2: "§g1958.03.17§! · 近地轨道"
 NSP_ARCH_TT_2: "§YVanguard 1§!\n§g1958.03.17 · 卡纳维拉尔角 · 先锋号§!\n--------------\n海军的先锋号终于成功了。这颗 1.5 公斤的太阳能卫星被赫鲁晓夫嘲笑为「葡萄柚」，但它的轨道会保持几百年。\n\n结果：§G成功§!"
 NSP_ARCH_NAME_3: "Pioneer 1"
 NSP_ARCH_ETA_3: "§g1958.10.11§! · 地月转移"
 NSP_ARCH_TT_3: "§YPioneer 1§!\n§g1958.10.11 · 卡纳维拉尔角 · 雷神-艾布尔§!\n--------------\n新成立的 NASA 的第一次发射。雷神-艾布尔火箭二级关机过早，探测器只爬到 113,800 公里高度，没能抵达月球，再入大气层烧毁。\n\n结果：§R失败§!"
 NSP_ARCH_NAME_4: "Project SCORE"
 NSP_ARCH_ETA_4: "§g1958.12.18§! · 近地轨道"
 NSP_ARCH_TT_4: "§YProject SCORE§!\n§g1958.12.18 · 卡纳维拉尔角 · 宇宙神 B§!\n--------------\n整枚宇宙神 B 火箭进入轨道，用录音机向全世界播放了艾森豪威尔总统的圣诞致辞，这是第一颗通信中继卫星。\n\n结果：§G成功§!"
 NSP_ARCH_NAME_5: "Pioneer 4"
 NSP_ARCH_ETA_5: "§g1959.03.03§! · 逃逸地球"
 NSP_ARCH_TT_5: "§YPioneer 4§!\n§g1959.03.03 · 卡纳维拉尔角 · 朱诺 II§!\n--------------\n朱诺 II 火箭把先驱者 4 号送出地球引力，从月球旁 6 万公里处飞过，成为美国第一个进入日心轨道的探测器。\n\n结果：§G成功§!"
 NSP_ARCH_NAME_6: "Explorer 6"
 NSP_ARCH_ETA_6: "§g1959.08.07§! · 近地轨道"
 NSP_ARCH_TT_6: "§YExplorer 6§!\n§g1959.08.07 · 卡纳维拉尔角 · 雷神-艾布尔§!\n--------------\n探险者 6 号从太空中拍下了第一张地球照片：一块模糊的、被阳光照亮的太平洋云层。\n\n结果：§G成功§!"
 NSP_ARCH_NAME_7: "TIROS 1"
 NSP_ARCH_ETA_7: "§g1960.04.01§! · 近地轨道"
 NSP_ARCH_TT_7: "§YTIROS 1§!\n§g1960.04.01 · 卡纳维拉尔角 · 雷神-艾布尔§!\n--------------\n第一颗成功的气象卫星。它在 78 天里拍了 22,952 张云图，气象预报从此改变了。\n\n结果：§G成功§!"
 NSP_ARCH_NAME_8: "Echo 1A"
 NSP_ARCH_ETA_8: "§g1960.08.12§! · 近地轨道"
 NSP_ARCH_TT_8: "§YEcho 1A§!\n§g1960.08.12 · 卡纳维拉尔角 · 雷神-德尔塔§!\n--------------\n一个直径 30 米的镀铝聚酯气球。它是被动通信卫星，地面电台把信号打到它身上再反射回来。晴朗的夜里肉眼就能看见它划过星空。\n\n结果：§G成功§!"
 NSP_ARCH_NAME_9: "Mercury-Redstone 1"
 NSP_ARCH_ETA_9: "§g1960.11.21§! · 亚轨道"
 NSP_ARCH_TT_9: "§YMercury-Redstone 1§!\n§g1960.11.21 · 卡纳维拉尔角 · 水星-红石§!\n--------------\n火箭点火后只升高了约 10 厘米就关机落回发射台，逃逸塔却单独飞走了，降落伞在火箭顶上展开。后人称之为「四英寸飞行」。\n\n结果：§R失败§!"
 NSP_ARCH_NAME_10: "Mercury-Redstone 2"
 NSP_ARCH_ETA_10: "§g1961.01.31§! · 亚轨道"
 NSP_ARCH_TT_10: "§YMercury-Redstone 2§!\n§g1961.01.31 · 卡纳维拉尔角 · 水星-红石§!\n--------------\n黑猩猩汉姆完成了 16 分钟的亚轨道飞行，并在飞行中正确完成了拉杆操作。过载超出预期，它平安回来了。\n\n结果：§G成功§!"
 NSP_ARCH_NAME_11: "Freedom 7"
 NSP_ARCH_ETA_11: "§g1961.05.05§! · 亚轨道"
 NSP_ARCH_TT_11: "§YFreedom 7§!\n§g1961.05.05 · 卡纳维拉尔角 · 水星-红石§!\n--------------\n艾伦·谢泼德成为第一个进入太空的美国人。15 分钟的飞行全国直播，二十天后肯尼迪总统在国会提出了登月目标。\n\n结果：§G成功§!"
 NSP_ARCH_NAME_12: "Liberty Bell 7"
 NSP_ARCH_ETA_12: "§g1961.07.21§! · 亚轨道"
 NSP_ARCH_TT_12: "§YLiberty Bell 7§!\n§g1961.07.21 · 卡纳维拉尔角 · 水星-红石§!\n--------------\n格斯·格里索姆完成第二次载人亚轨道飞行。溅落后舱门意外炸开，飞船沉入大西洋，格里索姆险些溺水。\n\n结果：§G成功§!"
 NSP_ARCH_NAME_13: "Mercury-Atlas 5"
 NSP_ARCH_ETA_13: "§g1961.11.29§! · 近地轨道"
 NSP_ARCH_TT_13: "§YMercury-Atlas 5§!\n§g1961.11.29 · 卡纳维拉尔角 · 水星-宇宙神§!\n--------------\n黑猩猩伊诺斯绕地球飞行了两圈。姿态控制故障让任务提前结束，但宇宙神火箭已经证明可以载人入轨。下一次，坐在里面的会是约翰·格伦。\n\n结果：§G成功§!"
