 NSP_PERF_TITLE: "§W性能§!"
 NSP_MARGIN_G: "§G[?NSP_calc_margin|+.1]§!"
 NSP_MARGIN_R: "§R[?NSP_calc_margin|.1]§!"
 NSP_PERF_TT: "§Y性能§!  §g火箭能提供的速度增量 Delta-V（km/s）§!\n§g--------------§!\n§Y实际：[?NSP_calc_act_dv|.2] km/s§!\n  火箭方程（含载荷质量）：[?NSP_bd_dv_base|.2] km/s[GetNSPBD_dv_mod][GetNSPBD_dv_tech]\n\n§Y需求：[?NSP_calc_req_dv|.2] km/s§!\n  目的地：[?NSP_bd_req_base|.2] km/s[GetNSPBD_req_site][GetNSPBD_req_tech]\n\n余量：[GetNSPMargin]"
 NSP_PERF_TT_D: "§gDelta-V = I_sp * g0 * ln(m_i / m_f)\n\nm_i = 干重 + 燃料 + 载荷\nm_f = 干重 + 载荷\n结果 * §Y[?NSP_dv_k|.2]§!（游戏化系数），再加发射修正。§!"
 NSP_REL_TITLE: "§W可靠性§!"
 NSP_REL_TT: "§Y可靠性§!  §g决定任务的成功概率§!\n§g--------------§!\n§Y载荷：[?NSP_calc_rel_payload|0]%§!\n  基础值：[?NSP_bd_pl_raw|.1]%\n  基础值按 75% 计：§R[?NSP_bd_pl_cut|.1]%§![GetNSPBD_pl_mod][GetNSPBD_pl_rd][GetNSPBD_pl_tech][GetNSPBD_pl_dir][GetNSPBD_pl_half]\n\n§Y火箭：[?NSP_calc_rel_vehicle|0]%§!\n  基础值：[?NSP_bd_ve_raw|.1]%\n  基础值按 75% 计：§R[?NSP_bd_ve_cut|.1]%§![GetNSPBD_ve_mod][GetNSPBD_ve_rd][GetNSPBD_ve_tier][GetNSPBD_ve_tech][GetNSPBD_ve_dir][GetNSPBD_ve_half]\n\n§Y总计：[?NSP_calc_rel_final|0]%§!（载荷 × 火箭[GetNSPBD_rel_ev]）"
 NSP_REL_TT_D: "§g载荷 / 火箭可靠性 = 基础值 × §Y75%§! + 加成 × §Y50%§!（惩罚照算）\n总可靠性 = 载荷可靠性 × 火箭可靠性，决定发射和在轨能否成功。\n\n载人任务在轨成功后还要返程：返程可靠性 = 100 − (100 − 载荷可靠性) ÷ 5。返程失败，乘组遇难。\n每名宇航员每有一次飞行经验，主任务和返程可靠性各 +0.5（最多 +2）。§!"
