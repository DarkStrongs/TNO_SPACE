 NSP_MOD_INTRO_0: "§g把固体燃料助推器捆绑在芯级两侧，起飞时一起点火，烧完后抛掉。它能给火箭加一大截推力，但多了分离环节，也就多了出事的机会。§!"
 NSP_MOD_INTRO_1: "§g以液氢 / 液氧为推进剂的高能上面级，比冲远超常规推进剂。液氢极难储存，还会让材料变脆，半人马的研制一直磕磕绊绊。§!"
 NSP_MOD_INTRO_2: "§g在现有发动机上提高燃烧室压力、改进喷注器，换来更高的推力和比冲。代价是发动机工作更接近极限。§!"
 NSP_MOD_INTRO_3: "§g给双子星飞船加装更大的服务舱和推进系统，让它有能力飞向月球。这是「双子星登月」方案的核心，飞船会更重，准备周期也更长。§!"
 NSP_MOD_INTRO_4: "§g让两艘飞船在轨道上对接，交换乘员和推进剂。这是月球轨道交会方案离不开的技术，也是双子星计划要验证的头号目标。§!"
 NSP_MOD_INTRO_5: "§g加压航天服、脐带和舱门程序，让宇航员能离开飞船、在真空中工作。第一次舱外活动的风险很高，需要大量地面训练。§!"
 NSP_MOD_INTRO_6: "§g展开式光伏阵列给飞船持续供电，延长在轨寿命，不用再完全依赖化学电池。§!"
 NSP_MOD_INTRO_7: "§g多带一组氢氧燃料电池，既能发电也能产水。主电源出了问题时，它能让飞船撑到返回。§!"
 NSP_MOD_INTRO_8: "§g并联一套备份惯性制导计算机和陀螺平台，主系统失效时自动切换。重量和成本略有增加，但能挡住最常见的发射失败原因之一。§!"
 NSP_MOD_INTRO_9: "§g让土星的 S-IVB 三级在停泊轨道上再次点火，把飞船推向更高的轨道或地月转移轨道。发动机要在失重状态下重新启动，难度不小。§!"
 NSP_MOD_INTRO_10: "§g把 F-1 发动机的推力从 680 吨提升到 700 吨以上。第一级的推力会显著增加，燃烧不稳定的风险也随之上升。§!"
 NSP_MOD_INTRO_11: "§g用核反应堆加热液氢产生推力，比冲约为化学火箭的两倍。性能惊人，但核安全和公众舆论是绕不开的难题。§!"
 NSP_MOD_INTRO_12: "§g简化测试和检查流程，缩短在发射台上的准备时间。工期会明显缩短，漏掉问题的概率却变高了。§!"
 NSP_MOD_INTRO_13: "§g装在飞船上的雷达能测出目标的距离和接近速度，让交会从靠目视的冒险变成可以精确计算的机动。§!"
 NSP_MOD_INTRO_14: "§g加厚烧蚀防热层，提高再入时的安全余量，尤其适合从高能轨道返回的任务。§!"
 NSP_MOD_INTRO_15: "§g救生筏、无线电信标、淡水和沙漠 / 丛林求生物资，以防溅落点偏离、回收舰队一时找不到人。§!"
 NSP_MOD_INTRO_16: "§g装有氮气推进器的背包式机动装置，宇航员不系脐带就能在舱外自由移动，主要用于维修和装配作业。§!"
 NSP_MOD_INTRO_17: "§g统一 S 波段系统把遥测、语音和测距合并在一个频段上，深空通信更稳定，地面跟踪也更精确。§!"
 NSP_MOD_INTRO_18: "§g放射性同位素热电发生器靠钚-238 衰变产生电力，能工作很多年，适合远离太阳、光照不足的深空探测器。§!"
 NSP_MOD_INTRO_19: "§g让航天器的空气和水在舱内循环再生，减少消耗品补给，是长时间载人飞行的基础。§!"

