 NSP_POPULARITY_TT_D: "§g任务成功 +3，失败 -5，重大研发成果也会提升；平时缓慢回落到 50%。\n国会按支持度拨款：每周累计 30 + 支持度 × 0.8（百万美元），每 26 周拨付一次。§!"
