 # ---- 太阳系：天体与卫星提示（NSP_TT_X = 第一层，NSP_TT_F_X = 第二层） ----
 NSP_TT_SUN:0 "§W太阳§!\n§FG2V 型主序星 · 太阳系中心§!"
 NSP_TT_SUN_D:0 "§F直径：§!§Y1,392,700 km§!\n§F质量：§!§Y333,000 个地球§!\n§F表面温度：§!§Y5,500 °C§!\n§F自转周期：§!§Y25.4 天（赤道）§!\n§F活动周期：§!§Y约 11 年§!\n\n§F太阳耀斑和高能粒子是地月空间里宇航员最大的辐射威胁。登月任务要避开太阳活动高峰，飞船屏蔽和预警网络也同样重要。§!"
 NSP_TT_MOON:0 "§W月球§!\n§F地球唯一的天然卫星§!"
 NSP_TT_MOON_D:0 "§F距地距离：§!§Y384,400 km§!\n§F直径：§!§Y3,474 km§!\n§F表面重力：§!§Y0.17 g§!\n§F公转周期：§!§Y27.3 天（潮汐锁定）§!\n§F温度：§!§Y-173 ~ 127 °C§!\n§F单程航程：§!§Y约 3 天§!\n\n§F太空竞赛的终点线。要安全着陆，先得靠无人探测器摸清月壤承重；还要用月球轨道器拍到 1 米级的着陆区照片。§!"
 NSP_TT_MERCURY:0 "§W水星§!\n§F类地行星 · 离太阳最近§!\n§G点击：放大查看§!"
 NSP_TT_MERCURY_D:0 "§F距日距离：§!§Y0.39 AU§!\n§F直径：§!§Y4,879 km§!\n§F质量：§!§Y0.055 个地球§!\n§F公转周期：§!§Y88 天§!\n§F自转周期：§!§Y58.6 天§!\n§F已知卫星：§!§Y0§!\n§F温度：§!§Y-173 ~ 427 °C§!\n\n§F深陷太阳引力井，直飞要的速度增量比去冥王星还大，只能借金星引力助推。§!"
 NSP_TT_VENUS:0 "§W金星§!\n§F类地行星 · 地球的“姊妹星”§!\n§G点击：放大查看§!"
 NSP_TT_VENUS_D:0 "§F距日距离：§!§Y0.72 AU§!\n§F直径：§!§Y12,104 km§!\n§F质量：§!§Y0.815 个地球§!\n§F公转周期：§!§Y225 天§!\n§F自转周期：§!§Y-243 天（逆行）§!\n§F表面温度：§!§Y464 °C§!\n§F表面气压：§!§Y92 个大气压§!\n\n§F厚云遮住了地表。微波辐射计测出的表面温度足以熔化铅，打破了“金星沼泽”的幻想。发射窗口每 19 个月一次。§!"
 NSP_TT_EARTH:0 "§W地球§!\n§F类地行星 · 我们的家园§!\n§G点击：放大查看§!"
 NSP_TT_EARTH_D:0 "§F距日距离：§!§Y1.00 AU§!\n§F直径：§!§Y12,742 km§!\n§F公转周期：§!§Y365.25 天§!\n§F自转周期：§!§Y23 时 56 分§!\n§F已知卫星：§!§Y1§!\n§F入轨速度：§!§Y7.8 km/s§!\n\n§F每一项任务都从这里开始，也要回到这里。气象卫星、通信卫星和地面跟踪网都在近地空间，太空计划最直接的回报也在这里。§!"
 NSP_TT_MARS:0 "§W火星§!\n§F类地行星 · 红色星球§!\n§G点击：放大查看§!"
 NSP_TT_MARS_D:0 "§F距日距离：§!§Y1.52 AU§!\n§F直径：§!§Y6,779 km§!\n§F质量：§!§Y0.107 个地球§!\n§F公转周期：§!§Y687 天§!\n§F自转周期：§!§Y24 时 37 分§!\n§F已知卫星：§!§Y2§!\n§F大气：§!§Y约地球的 0.6%§!\n\n§F水手 4 号传回的照片满是陨石坑，运河之说随之破灭。发射窗口每 26 个月一次。载人登陆需要核热推进和火星远征舱。§!"
 NSP_TT_JUPITER:0 "§W木星§!\n§F气态巨行星 · 太阳系最大§!\n§G点击：放大查看§!"
 NSP_TT_JUPITER_D:0 "§F距日距离：§!§Y5.20 AU§!\n§F直径：§!§Y139,820 km§!\n§F质量：§!§Y317.8 个地球§!\n§F公转周期：§!§Y11.9 年§!\n§F自转周期：§!§Y9 时 56 分§!\n§F已知卫星：§!§Y12§!\n\n§F去木星要穿过小行星带，还要扛住强烈的辐射带。这么远太阳能不够用，只能靠放射性同位素电池（RTG）供电，通信则需要更大的深空天线。§!"
 NSP_TT_SATURN:0 "§W土星§!\n§F气态巨行星 · 光环之星§!\n§G点击：放大查看§!"
 NSP_TT_SATURN_D:0 "§F距日距离：§!§Y9.58 AU§!\n§F直径：§!§Y116,460 km§!\n§F质量：§!§Y95.2 个地球§!\n§F公转周期：§!§Y29.5 年§!\n§F自转周期：§!§Y10 时 33 分§!\n§F已知卫星：§!§Y10§!\n\n§F光环由无数冰粒组成，最大的卫星土卫六有浓厚大气。单程要好几年，只有借木星引力加速才现实。§!"
 NSP_TT_URANUS:0 "§W天王星§!\n§F冰巨星 · 侧躺着自转§!\n§G点击：放大查看§!"
 NSP_TT_URANUS_D:0 "§F距日距离：§!§Y19.2 AU§!\n§F直径：§!§Y50,724 km§!\n§F质量：§!§Y14.5 个地球§!\n§F公转周期：§!§Y84 年§!\n§F自转周期：§!§Y-17 时 14 分§!\n§F自转轴倾角：§!§Y98°§!\n§F已知卫星：§!§Y5§!\n\n§F自转轴几乎躺平，南北极轮流对着太阳各 42 年。只有“行星大旅行”这样的连续引力助推才能把探测器送过去。§!"
 NSP_TT_NEPTUNE:0 "§W海王星§!\n§F冰巨星 · 太阳系最外侧§!\n§G点击：放大查看§!"
 NSP_TT_NEPTUNE_D:0 "§F距日距离：§!§Y30.1 AU§!\n§F直径：§!§Y49,244 km§!\n§F质量：§!§Y17.1 个地球§!\n§F公转周期：§!§Y164.8 年§!\n§F自转周期：§!§Y16 时 06 分§!\n§F已知卫星：§!§Y2§!\n\n§F1970 年代末，外行星会罕见地排成一列（约 175 年一遇），一艘探测器就能依次飞掠木、土、天王、海王四颗行星。错过这个窗口就要再等下个世纪。§!"
