 NSP_RD_DESC_91: "V-2 与早期探空火箭的内陆试验场，1945 年启用，只能发射轻型火箭。开局即已建成。"
 NSP_RD_UNLOCK_91: "§D解锁发射场§!§Y白沙导弹靶场§!\n§g小型发射场§!"
 NSP_RD_REQS_91: "无"
 NSP_RD_N_92: "约翰斯顿环礁"
 NSP_RD_DESC_92: "夏威夷西南约 1300 公里的孤立环礁，1962 年雷神导弹在这里发射。北纬 16.7°，适合向东发射进入地球静止轨道；补给全靠海运。"
 NSP_RD_UNLOCK_92: "§D解锁发射场§!§Y约翰斯顿环礁§!\n地球静止：\n  所需 Delta-V：§G-0.2§!"
 NSP_RD_REQS_92: "太平洋导弹靶场"
 NSP_RD_N_93: "波克平原"
 NSP_RD_DESC_93: "费尔班克斯附近的高纬度火箭靶场，用于极光与极区高层大气研究。"
 NSP_RD_UNLOCK_93: "§D解锁发射场§!§Y波克平原火箭靶场§!\n极地：\n  所需 Delta-V：§G-0.4§!"
 NSP_RD_REQS_93: "白沙导弹靶场"
 NSP_RD_N_94: "科研卫星"
 NSP_RD_DESC_94: "轨道地球物理台（OGO）：在大椭圆轨道上测量范艾伦辐射带、磁场和太阳风的大型科学卫星。"
 NSP_RD_UNLOCK_94: "§D解锁载荷§!§Y科研卫星§!\n§D解锁目的地§!§Y中地球轨道§!\n公众支持度：§G+2§!"
 NSP_RD_REQS_94: "无"

